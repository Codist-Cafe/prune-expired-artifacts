name: Prune expired artifacts

# Reclaims Actions artifact storage by deleting artifacts already past their
# `expires_at`. See scripts/prune-expired-artifacts.sh for the full rationale.
#
# ── Setup for a new repo ──────────────────────────────────────────────────────
# Copy this file to .github/workflows/ and the script to scripts/ in the target
# repo, then `chmod +x scripts/prune-expired-artifacts.sh`. Nothing else is
# required — no secrets, no configuration.
#
# The default GITHUB_TOKEN can delete artifacts in its own repo, so no PAT or
# secret is needed. Set the `schedule` cron (or remove it) to taste.

on:
  schedule:
    # 03:17 UTC daily. Off the hour deliberately: GitHub's scheduler queues
    # behind load at :00, and 03:00-05:00 UTC is the low point for Actions load.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be deleted, without deleting it"
        type: boolean
        default: true
  # Lets another repo reuse this instead of vendoring a copy:
  #   jobs:
  #     prune:
  #       uses: Codist-Cafe/prune-expired-artifacts/.github/workflows/prune-artifacts.yml@main
  workflow_call:
    inputs:
      dry_run:
        description: "Report what would be deleted, without deleting it"
        type: boolean
        default: false
      max_storage_mb:
        description: "Your plan's artifact storage limit in MB (Free 500, Pro 1024, Team 2048)"
        type: number
        default: 500
      runs_on:
        description: >-
          Runner label for the prune job. Defaults to ubuntu-latest (GitHub-hosted).
          Set to a self-hosted label (e.g. 'abideid-dev') to avoid GitHub-hosted
          Actions minutes — useful when billing blocks GitHub-hosted jobs, since
          self-hosted runners are not billed and are unaffected.
        type: string
        required: false
        default: ubuntu-latest
      self_repo:
        description: >-
          Where the prune script lives: owner/repo. Defaults to this repo. Only
          override if this repo is renamed, moved, or forked.
        type: string
        required: false
        default: Codist-Cafe/prune-expired-artifacts
      self_ref:
        description: >-
          Git ref of self_repo to check out. Defaults to main. Pin to a tag or SHA
          for an immutable, reproducible prune.
        type: string
        required: false
        default: main

permissions:
  # actions:write is required to DELETE artifacts. Scoped to this job rather than
  # granted repo-wide, so no other job gains deletion capability.
  actions: write
  contents: read

jobs:
  prune:
    name: Delete artifacts past expires_at
    # Defaults to ubuntu-latest. A caller may pass a self-hosted label via the
    # `runs_on` input; this job needs only `gh` + `jq`, so any Linux runner works.
    # Note: a reusable workflow cannot fall back to the caller's runner
    # automatically — the label must be named explicitly by the caller.
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    steps:
      # IMPORTANT: the script lives in THIS repo, but a reusable workflow's
      # `actions/checkout` defaults to the CALLER's repository. Two things that
      # look like they would fix this do NOT:
      #   - `github.repository`  -> the caller
      #   - `github.workflow_ref` -> ALSO the caller (verified 2026-09-21: it
      #     resolved to Codist-Cafe/Abide-ID-2026, the caller, not this repo)
      #
      # So the location is pinned explicitly rather than inferred. `self_repo`
      # defaults to this repo and only needs overriding if the repo is renamed,
      # moved, or forked. `self_ref` defaults to the ref the caller invoked.
      - name: Resolve the workflow's own repository
        id: self
        run: |
          echo "repo=${{ inputs.self_repo || 'Codist-Cafe/prune-expired-artifacts' }}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ inputs.self_ref || 'main' }}" >> "$GITHUB_OUTPUT"
          echo "checking out ${{ inputs.self_repo || 'Codist-Cafe/prune-expired-artifacts' }}@${{ inputs.self_ref || 'main' }}"

      - uses: actions/checkout@v5
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ steps.self.outputs.ref }}

      # Fail loudly with an actionable message if a self-hosted runner lacks a
      # dependency, rather than dying obscurely inside the script.
      - name: Check dependencies
        run: |
          set -euo pipefail
          missing=""
          command -v gh  >/dev/null 2>&1 || missing="$missing gh"
          command -v jq  >/dev/null 2>&1 || missing="$missing jq"
          # GNU date is required; BSD date (macOS) lacks -d. gdate is accepted.
          if ! date -u -d "@0" +%s >/dev/null 2>&1 && ! command -v gdate >/dev/null 2>&1; then
            missing="$missing GNU-date"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Runner '${{ inputs.runs_on || 'ubuntu-latest' }}' is missing:$missing"
            echo "Install these on the runner (or omit the runs_on input to use"
            echo "ubuntu-latest, which has all three preinstalled)."
            exit 1
          fi
          echo "dependencies present: gh, jq, $(date --version >/dev/null 2>&1 && echo 'GNU date' || echo 'gdate')"

      - name: Prune expired artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Precedence: an explicit workflow_call input wins; workflow_dispatch
          # falls back to its own input; a scheduled run has neither and deletes.
          DRY_RUN: ${{ (inputs.dry_run || github.event.inputs.dry_run == 'true') && '1' || '0' }}
          MAX_STORAGE_MB: ${{ inputs.max_storage_mb || 500 }}
        run: |
          set -euo pipefail
          ./scripts/prune-expired-artifacts.sh "$REPO"

      - name: Note the impact on failure
        if: failure()
        run: |
          echo "::warning::Artifact pruning failed. Until it succeeds, upload-artifact"
          echo "::warning::steps may fail with 'Artifact storage quota has been hit'."
          echo "::warning::Check the run log above for the per-artifact failures."
